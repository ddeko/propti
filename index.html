function translate(lang,key,vars){
  let s = (I18N[lang] && I18N[lang][key]) || I18N.en[key] || key;
  if(vars) for(const k in vars) s = s.split('{'+k+'}').join(vars[k]);
  return s;
}
const LANG_KEY='propti.lang';
function timeAgo(ts,t){
  const s=Math.floor((now()-ts)/1000); const id = t && t('common.with')==='dengan';
  if(s<60) return id?'baru saja':'just now';
  const m=Math.floor(s/60); if(m<60) return m+'m';
  const h=Math.floor(m/60); if(h<24) return h+'j';
  const d=Math.floor(h/24); if(d<7) return d+(id?'h':'d');
  return new Date(ts).toLocaleDateString('id-ID');
}

/* ---------- gamification math ---------- */
function levelInfo(xp){
  let level=1, need=120, acc=0;
  while(xp>=acc+need){ acc+=need; level++; need=Math.round(need*1.22); }
  const into=xp-acc;
  return {level,into,need,pct:Math.max(0,Math.min(100,Math.round(into/need*100)))};
}

  return arr.sort((a,b)=>b.ts-a.ts);

/* ---------- persistence ---------- */
const KEY='propti.v1';
function freshDB(){
  const leads=seedLeads();
  return {
    profile:{name:'Andi Pratama',avatar:'😎',xp:1620,points:540,lifetimePoints:540,
      titleId:'t-hustler',ownedTitles:['t-rookie','t-hustler'],joined:now()-40*864e5},
    leads, properties:seedProps(), activities:seedActivities(leads),
    quests:seedQuests(), achievements:seedAchievements().map(a=>({id:a.id,unlocked:false})),
    redeemed:[], lastDailyReset:dayKey(),
  };
}
function loadDB(){ try{ const raw=localStorage.getItem(KEY); if(raw){ const d=JSON.parse(raw); if(d.profile && /‍/.test(d.profile.avatar||'')) d.profile.avatar='😎'; return d; } }catch(e){} const d=freshDB(); save(d); return d; }
function save(d){ try{ localStorage.setItem(KEY,JSON.stringify(d)); }catch(e){} }

/* activity description (language-aware) */
function mkDesc(t,a){
  if(a.type==='deal') return t('act.closedWith',{name:a.leadName||''});
  const label=t('act.'+a.type+'.label');
  if(a.leadName && a.leadName!=='—') return t('act.withLead',{label,name:a.leadName});
  return label;
}

/* ============ App Context ============ */
const Ctx=createContext(null);
const useApp=()=>useContext(Ctx);

function AppProvider({children}){
  const [db,setDb]=useState(loadDB);
  const [lang,setLangState]=useState(()=>{ try{ return localStorage.getItem(LANG_KEY)||'id'; }catch(e){ return 'id'; } });
  const [toasts,setToasts]=useState([]);
  const [confetti,setConfetti]=useState(0);
  const [levelUp,setLevelUp]=useState(null);

  useEffect(()=>{ save(db); },[db]);
  const setLang=useCallback(l=>{ setLangState(l); try{ localStorage.setItem(LANG_KEY,l); }catch(e){} },[]);
  const t=useCallback((k,v)=>translate(lang,k,v),[lang]);

  const toast=useCallback((msg,opts={})=>{ const id=uid(); setToasts(x=>[...x,{id,msg,...opts}]);
    setTimeout(()=>setToasts(x=>x.filter(o=>o.id!==id)),opts.dur||3200); },[]);
  const celebrate=useCallback(()=>setConfetti(c=>c+1),[]);

  const stats=useMemo(()=>{ const a=db.activities; return {
    totalActs:a.length, dealsWon:a.filter(x=>x.type==='deal').length, viewings:a.filter(x=>x.type==='viewing').length,
    leadCount:db.leads.length, level:levelInfo(db.profile.xp).level, lifetimePoints:db.profile.lifetimePoints }; },[db]);

  useEffect(()=>{
    let gx=0,gp=0,newly=[]; const map=Object.fromEntries(db.achievements.map(a=>[a.id,a.unlocked]));
    ACH_DEFS.forEach(def=>{ if(!map[def.id] && def.check(stats)){ map[def.id]=true; gx+=def.xp; gp+=def.pts; newly.push(def); } });
    if(newly.length){
      setDb(d=>({...d, achievements:d.achievements.map(a=>({...a,unlocked:map[a.id]})),
        profile:{...d.profile,xp:d.profile.xp+gx,points:d.profile.points+gp,lifetimePoints:d.profile.lifetimePoints+gp}}));
      newly.forEach(n=>toast(t('toast.achvUnlocked',{title:t('achv.'+n.id+'.title')}),{icon:n.icon,kind:'achv'}));
      celebrate();
    }
  },[stats.totalActs,stats.dealsWon,stats.viewings,stats.leadCount,stats.level,stats.lifetimePoints]);

  const applyGain=useCallback((xp,pts,metric)=>{
    setDb(d=>{
      const before=levelInfo(d.profile.xp).level, after=levelInfo(d.profile.xp+xp).level;
      let bonusXp=0,bonusPts=0,completed=[];
      const quests=d.quests.map(q=>{
        if(q.done) return q;
        const hit=q.metric===metric || (q.metric==='any' && metric!=='lead');
        if(!hit) return q;
        const progress=Math.min(q.target,q.progress+1); const done=progress>=q.target;
        if(done && !q.claimed){ bonusXp+=q.xp; bonusPts+=q.pts; completed.push(q); return {...q,progress,done:true,claimed:true}; }
        return {...q,progress,done};
      });
      setTimeout(()=>{
        completed.forEach(q=>toast(t('toast.questComplete',{title:t('quest.'+q.id),xp:q.xp}),{icon:q.icon,kind:'quest'}));
        if(completed.length) celebrate();
        if(after>before){ setLevelUp(after); celebrate(); }
      },0);
      const totalPts=pts+bonusPts;
      return {...d,quests,profile:{...d.profile,xp:d.profile.xp+xp+bonusXp,points:d.profile.points+totalPts,lifetimePoints:d.profile.lifetimePoints+totalPts}};
    });
  },[toast,celebrate,t]);

  const actions=useMemo(()=>({
    logActivity({type,leadId}){
      const at=ACT_TYPES[type]; const lead=db.leads.find(l=>l.id===leadId);
      const entry={id:uid(),type,leadId:leadId||null,leadName:lead?lead.name:'—',ts:now(),xp:at.xp,pts:at.pts};
      setDb(d=>({...d,activities:[entry,...d.activities],leads:leadId?d.leads.map(l=>l.id===leadId?{...l,lastContact:now()}:l):d.leads}));
      applyGain(at.xp,at.pts,type);
      toast(t('toast.xpLogged',{xp:at.xp,label:t('act.'+type+'.label')}),{icon:at.icon,kind:'xp'});
    },
    addLead(data){ const lead={id:uid(),createdAt:now(),lastContact:now(),status:'new',notes:'',...data};
      setDb(d=>({...d,leads:[lead,...d.leads]})); applyGain(15,8,'lead'); toast(t('toast.leadAdded'),{icon:'➕',kind:'xp'}); return lead; },
    updateLead(id,patch){ setDb(d=>({...d,leads:d.leads.map(l=>l.id===id?{...l,...patch}:l)})); },
    moveLead(id,status){ const lead=db.leads.find(l=>l.id===id); const wasWon=lead&&lead.status==='won';
      setDb(d=>({...d,leads:d.leads.map(l=>l.id===id?{...l,status,lastContact:now()}:l)}));
      if(status==='won' && !wasWon){ const at=ACT_TYPES.deal;
        const entry={id:uid(),type:'deal',leadId:id,leadName:lead?lead.name:'—',ts:now(),xp:at.xp,pts:at.pts};
        setDb(d=>({...d,activities:[entry,...d.activities]})); applyGain(at.xp,at.pts,'deal');
        toast(t('toast.dealWon',{xp:at.xp}),{icon:'🏆',kind:'xp',dur:4200}); celebrate(); } },
    deleteLead(id){ setDb(d=>({...d,leads:d.leads.filter(l=>l.id!==id)})); },
    addProperty(data){ setDb(d=>({...d,properties:[{id:uid(),status:'available',img:'🏠',...data},...d.properties]})); toast(t('toast.listingAdded'),{icon:'🏠'}); },
    updateProperty(id,patch){ setDb(d=>({...d,properties:d.properties.map(p=>p.id===id?{...p,...patch}:p)})); },
    redeemReward(r){ if(db.profile.points<r.cost){ toast(t('toast.notEnough'),{icon:'🚫',kind:'err'}); return; }
      setDb(d=>({...d,profile:{...d.profile,points:d.profile.points-r.cost},redeemed:[{id:uid(),rid:r.id,icon:r.icon,cost:r.cost,ts:now()},...d.redeemed]}));
      toast(t('toast.redeemed',{title:t('reward.'+r.id+'.title')}),{icon:r.icon,kind:'reward'}); celebrate(); },
    buyTitle(tt){ if(db.profile.ownedTitles.includes(tt.id)){ actions.setTitle(tt.id); return; }
      if(db.profile.points<tt.cost){ toast(t('toast.notEnough'),{icon:'🚫',kind:'err'}); return; }
      setDb(d=>({...d,profile:{...d.profile,points:d.profile.points-tt.cost,ownedTitles:[...d.profile.ownedTitles,tt.id],titleId:tt.id}}));
      toast(t('toast.titleUnlocked',{name:t('title.'+tt.id+'.name')}),{icon:tt.icon,kind:'reward'}); celebrate(); },
    setTitle(id){ setDb(d=>({...d,profile:{...d.profile,titleId:id}})); },
    updateProfile(patch){ setDb(d=>({...d,profile:{...d.profile,...patch}})); },
    resetDailies(){ setDb(d=>({...d,quests:d.quests.map(q=>q.type==='daily'?{...q,progress:0,done:false,claimed:false}:q),lastDailyReset:dayKey()})); toast(t('toast.dailyReset'),{icon:'🔄'}); },
    resetAll(){ setDb(freshDB()); toast(t('toast.dataReset'),{icon:'♻️'}); }
  }),[db,applyGain,toast,celebrate,t]);

  const value={db,stats,actions,toast,celebrate,levelUp,setLevelUp,lang,setLang,t};
  return html`<${Ctx.Provider} value=${value}>
    ${children}
    <${ToastHost} toasts=${toasts} />
    ${confetti>0 && html`<${Confetti} key=${confetti} />`}
    ${levelUp && html`<${LevelUpModal} level=${levelUp} onClose=${()=>setLevelUp(null)} />`}
  <//>`;
}

/* ============ atoms ============ */
function ToastHost({toasts}){
  const accent={xp:'#244c72',quest:ACCENT,achv:'#b06a12',reward:'#1f8a52',err:'#c0392b',default:'#1d3856'};
  return html`<div class="fixed z-[60] top-3 left-1/2 -translate-x-1/2 sm:left-auto sm:right-4 sm:translate-x-0 flex flex-col gap-2 w-[92vw] sm:w-80 pointer-events-none">
    ${toasts.map(o=>{ const c=accent[o.kind]||accent.default; return html`<div key=${o.id} class="anim-up pointer-events-auto bg-white rounded-xl shadow-lift border border-slate-100 pl-1.5 pr-4 py-1.5 flex items-center gap-3">
      <span class="w-9 h-9 rounded-lg grid place-items-center text-lg shrink-0" style=${{background:c+'18'}}>${o.icon||'✨'}</span>
      <span class="text-sm font-semibold text-slate-800 leading-tight">${o.msg}</span>
    </div>`; })}
  </div>`;
}
function Confetti(){
  const items=useMemo(()=>Array.from({length:40}).map(()=>({left:Math.random()*100,delay:Math.random()*.4,dur:1.6+Math.random()*1.2,
    e:['🎉','🎊','⭐','✨','🏆','🟦','🟧'][Math.floor(Math.random()*7)]})),[]);
  const [show,setShow]=useState(true);
  useEffect(()=>{ const x=setTimeout(()=>setShow(false),2600); return ()=>clearTimeout(x); },[]);
  if(!show) return null;
  return html`<${Fragment}>${items.map((c,i)=>html`<div key=${i} class="confetti" style=${{left:c.left+'vw',animationDuration:c.dur+'s',animationDelay:c.delay+'s'}}>${c.e}</div>`)}<//>`;
}

    <div class="card shadow-card p-5"><h3 class="font-bold font-display mb-3 text-brand-800">🏷️ ${t('pf.equippedTitle')}</h3>
      <div class="flex gap-2 flex-wrap">${db.profile.ownedTitles.map(id=>{ const tt=TITLES.find(x=>x.id===id); if(!tt)return null; const active=db.profile.titleId===id;
        return html`<button key=${id} onClick=${()=>actions.setTitle(id)} class=${cls('px-3 py-2 rounded-xl text-sm font-bold border transition',active?'border-brand-500 bg-brand-50 text-brand-700':'border-slate-200 text-slate-600')}>${tt.icon} ${t('title.'+id+'.name')}</button>`; })}</div>
    </div>
    <div class="card shadow-card p-5"><h3 class="font-bold font-display mb-3 text-brand-800">🌐 ${t('pf.language')}</h3><${LangToggle} /></div>
    <div class="card shadow-card p-5"><h3 class="font-bold font-display mb-1 text-brand-800">⚙️ ${t('pf.demoControls')}</h3>
      <p class="text-xs text-slate-400 mb-3">${t('pf.demoNote')}</p>
      <button onClick=${()=>{ if(confirm(t('pf.resetConfirm'))) actions.resetAll(); }} class="text-sm font-bold text-rose-600 bg-rose-50 px-4 py-2.5 rounded-xl hover:bg-rose-100">♻️ ${t('pf.resetDemo')}</button></div>
    <${Modal} open=${edit} onClose=${()=>setEdit(false)} title=${t('pf.editProfile')}>
      <${Field} label=${t('pf.displayName')}><input class=${inputCls} value=${db.profile.name} onInput=${e=>actions.updateProfile({name:e.target.value})} /></${Field}>
      <div class="text-xs font-semibold text-slate-500 mb-1">${t('pf.avatar')}</div>
      <div class="flex flex-wrap gap-2">${avatars.map(a=>html`<button key=${a} onClick=${()=>actions.updateProfile({avatar:a})} class=${cls('w-12 h-12 rounded-xl text-2xl grid place-items-center border',db.profile.avatar===a?'border-brand-500 bg-brand-50':'border-slate-200')}>${a}</button>`)}</div>
      <button onClick=${()=>setEdit(false)} class="mt-4 w-full py-2.5 rounded-xl font-bold text-white bg-brand-700">${t('common.done')}</button>
    </${Modal}>
  </div>`;
}

/* ============ root ============ */
const PAGES={dashboard:Dashboard,leads:Leads,pipeline:Pipeline,properties:Properties,activities:Activities,quests:Quests,leaderboard:Leaderboard,achievements:Achievements,rewards:Rewards,profile:Profile};
function Shell(){
  const {t}=useApp();
  const [route,setRoute]=useState('dashboard'); const [moreOpen,setMoreOpen]=useState(false);
  const go=useCallback(id=>{ setRoute(id); setMoreOpen(false); window.scrollTo({top:0}); },[]);
  const Page=PAGES[route]||Dashboard; const title=t('nav.'+route);
  return html`<div class="flex min-h-screen">
    <${Sidebar} route=${route} go=${go} />
    <div class="flex-1 min-w-0 flex flex-col">
      <${TopBar} title=${title} go=${go} />
      <main class="flex-1 px-4 sm:px-6 py-4 sm:py-6 pb-24 lg:pb-8 max-w-7xl w-full mx-auto">
        <h1 class="lg:hidden text-2xl font-extrabold font-display mb-4 text-brand-800">${title}</h1>
        <div key=${route} class="anim-up"><${Page} go=${go} /></div>
      </main>
    </div>
    <${MobileNav} route=${route} go=${go} openMore=${()=>setMoreOpen(true)} />
    ${moreOpen && html`<div class="lg:hidden fixed inset-0 z-50 bg-brand-900/40 backdrop-blur-sm flex items-end" onClick=${()=>setMoreOpen(false)}>
      <div class="bg-white rounded-t-2xl w-full p-4 anim-up" onClick=${e=>e.stopPropagation()}>
        <div class="w-10 h-1 bg-slate-200 rounded-full mx-auto mb-3"></div>
        <div class="grid grid-cols-4 gap-3">${NAV.map(id=>html`<button key=${id} onClick=${()=>go(id)} class=${cls('flex flex-col items-center gap-1 p-3 rounded-xl text-xs font-bold',route===id?'bg-brand-50 text-brand-700':'text-slate-600')}>
          <${Icon} name=${id} size=22 /> ${t('nav.'+id)}</button>`)}</div>
        <div class="mt-4 flex justify-center"><${LangToggle} /></div>
      </div>
    </div>`}
  </div>`;
}
ReactDOM.createRoot(document.getElementById('root')).render(html`<${AppProvider}><${Shell} /></${AppProvider}>`);
</script>
</body>
</html>
